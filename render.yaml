services:
  - type: web
    name: cinemind-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: TMDB_API_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
